<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1v1 LOL - Battle Royale</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="game-wrapper">
            <!-- Game Map -->
            <div class="game-map" id="gameMap">
                <!-- Player will be rendered here -->
            </div>

            <!-- Health Bar (Bottom Left) -->
            <div class="health-bar-container">
                <div class="health-label">HP</div>
                <div class="health-bar">
                    <div class="health-fill" id="healthFill"></div>
                </div>
                <div class="health-text" id="healthText">100/100</div>
            </div>

            <!-- Loadout Box (Bottom Right) -->
            <div class="loadout-container">
                <div class="loadout-title">LOADOUT</div>
                <div class="loadout-items" id="loadoutItems">
                    <div class="loadout-empty">Empty</div>
                </div>
            </div>

            <!-- Interaction Prompt -->
            <div class="interaction-prompt" id="interactionPrompt" style="display: none;">
                Hold <span class="key">E</span> to open chest
            </div>

            <!-- Menu -->
            <div class="menu" id="menu">
                <h1>🎮 1v1 LOL</h1>
                <p>Battle Royale Arena</p>
                <button class="btn" onclick="startGame()">Start Game</button>
            </div>

            <!-- Game Over -->
            <div class="game-over" id="gameOver" style="display: none;">
                <h2 id="gameOverText">Game Over!</h2>
                <p id="gameOverReason"></p>
                <button class="btn" onclick="location.reload()">Play Again</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
